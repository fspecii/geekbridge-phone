[package]
name = "phone-macos"
description = "macOS Bluetooth transport: paired phones, RFCOMM services and calls through IOBluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
phone-core = { path = "../phone-core" }
log = "0.4"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"

[dev-dependencies]
phone-obex = { path = "../phone-obex" }
tempfile = "3"
